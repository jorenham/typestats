name: Collect

on:
  schedule:
    # daily at 06:00 UTC
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - packages/typestats-site/projects.toml
      - src/typestats/schema.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: reports
    steps:
      - name: checkout main
        uses: actions/checkout@v6.0.2

      - name: checkout data
        uses: actions/checkout@v6.0.2
        with:
          ref: data
          path: _data

      - uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.14t"

      - name: collect type-coverage data
        id: collect
        run: >-
          uv run -m typestats_site collect
          --data-dir _data/reports
          --backfill-limit 10

      - name: Commit and push new data
        if: always() && steps.collect.outcome != 'cancelled'
        uses: EndBug/add-and-commit@v10.0.0
        with:
          add: reports/
          commit: --signoff
          cwd: _data
          default_author: github_actions
          message: "Update type-coverage data"

      - name: Fail if collect failed
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
