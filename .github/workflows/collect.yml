name: Collect

on:
  schedule:
    # daily at 06:00 UTC
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - packages/typestats-site/projects.toml
      - src/typestats/schema.py
  workflow_dispatch:

permissions: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: collect
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write # push collected data to the data branch
    environment: reports
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h /

      - name: checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: checkout data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: _data
          persist-credentials: true

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14t"

      - name: collect type-coverage data
        id: collect
        run: >-
          uv run -m typestats_site collect
          --data-dir _data/reports
          --backfill-limit 10

      - name: Commit and push new data
        if: always() && steps.collect.outcome != 'cancelled'
        working-directory: _data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          git diff --staged --quiet && exit 0
          git commit --signoff -m 'Update type-coverage data'
          git push

      - name: Fail if collect failed
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
