name: Recollect

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  recollect:
    name: recollect
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # push collected data to the data branch
    environment: reports
    steps:
      - name: checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: checkout data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: data
          path: _data
          persist-credentials: true

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14t"

      - name: recollect type-coverage data
        run: >-
          uv run -m typestats_site collect
          --data-dir _data/reports
          --clean
          --backfill-limit 1000

      - name: Commit and push new data
        working-directory: _data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          git diff --staged --quiet && exit 0
          git commit --signoff -m 'Recollect type-coverage data'
          git push
