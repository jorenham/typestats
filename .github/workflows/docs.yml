name: Docs

on:
  push:
    branches: [main]
    paths:
      - packages/typestats-site/docs/**
      - .github/workflows/docs.yml
      - packages/typestats-site/projects.toml
      - uv.lock
      - packages/typestats-site/zensical.toml
      - packages/typestats-site/src/typestats_site/dashboard.py
      - packages/typestats-site/src/typestats_site/templates/**
  workflow_run:
    workflows: [Collect]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout main
        uses: actions/checkout@v6.0.2

      - name: checkout data
        uses: actions/checkout@v6.0.2
        with:
          ref: data
          path: _data

      - uses: actions/configure-pages@v5

      - uses: astral-sh/setup-uv@v7.3.1
        with:
          python-version: "3.14"

      - name: build dashboard pages
        run: >-
          uv run -m typestats_site
          dashboard
          --data-dir _data/reports
          --site-dir packages/typestats-site/_site
          --projects packages/typestats-site/projects.toml

      - name: build site
        run: uv run zensical build --config packages/typestats-site/zensical.toml --clean

      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: packages/typestats-site/site

      - id: deployment
        uses: actions/deploy-pages@v4.0.5
