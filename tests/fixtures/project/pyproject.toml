[build-system]
requires = ["uv_build<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = [
  "anypkg",
  "ignorepkg",
  "pkg",
  "mylib",
  "mylib_pyi",
  "stubpkg",
]

[project]
name = "test-project"
version = "0.1.0"
requires-python = ">=3.12"

# anchors pyrefly's config-walk; without it, the repo-root config excludes us
[tool.pyrefly]
