[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[project]
name = "typestats-site"
version = "0.0.0.dev0"
description = "Dashboard site generation and PyPI collection for typestats"
readme = "README.md"
authors = [
  { name = "Joren Hammudoglu", email = "jhammudoglu@gmail.com" },
]
license = "BSD-3-Clause"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.12"
dependencies = [
  "typestats",
  "mainpy>=1.5,<2",
  "tyro>=1.0.10",
  "anyio>=4.12.1,<5",
  "httpx[http2]>=0.28.1,<1",
  "httpx-retries>=0.4.6",
  "packaging>=26.0",
  "jinja2>=3.1.6,<4",
  "zensical>=0.0.28",
]

[tool.uv.sources]
typestats = { workspace = true }

[project.scripts]
typestats-site = "typestats_site:__main__.app"

[dependency-groups]
test = [
  "pytest>=9.0.2",
  "pytest-httpx>=0.36.0,<1",
]
dev = [
  { include-group = "test" },
  "uvloop>=0.22.1,<1; sys_platform != 'win32'",
  "watchfiles>=1.1.1,<2",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = ["error"]
log_level = "INFO"
strict = true
