[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "typestats-site"
version = "0.0.0.dev0"
description = "Dashboard site generation and PyPI collection for typestats"
readme = "README.md"
authors = [
  { name = "Joren Hammudoglu", email = "jhammudoglu@gmail.com" },
]
license = "BSD-3-Clause"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.12"
dependencies = [
  "typestats",
  "httpx[http2]>=0.28.1,<1",
  "httpx-retries>=0.5.0",
  "packaging>=26.2",
  "jinja2>=3.1.6,<4",
  "zensical>=0.0.45,<0.1.0",
  "watchfiles>=1.2.0,<2",
]

[tool.uv.sources]
typestats = { workspace = true }

[project.scripts]
typestats-site = "typestats_site:__main__.app"

[dependency-groups]
test = [
  "pytest>=9.1.0",
  "pytest-httpx>=0.36.2,<1",
]
dev = [
  { include-group = "test" },
  "uvloop>=0.22.1,<1; sys_platform != 'win32'",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["src", "tests"]
addopts = ["-ra", "--doctest-modules"]
doctest_optionflags = [
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "ELLIPSIS",
]
filterwarnings = ["error"]
log_level = "INFO"
strict = true

[tool.pyrefly]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
implicit-abstract-class = "error"
implicit-any = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
missing-source = "ignore"
not-required-key-access = "error"
open-unpacking = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
untyped-import = "error"
unused-ignore = "error"
variance-mismatch = "error"
