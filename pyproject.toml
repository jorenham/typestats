[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "typestats"
version = "0.3.0.dev0"
description = "Type annotation coverage statistics for Python packages"
readme = "README.md"
authors = [
  { name = "Joren Hammudoglu", email = "jhammudoglu@gmail.com" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.11,<5",
  "pydantic>=2.11,<3",
  "pyrefly>=1.0,<2",
  "tyro>=1.0,<2",
]

[project.scripts]
typestats = "typestats:__main__.app"

[dependency-groups]
site = ["typestats-site"]
test = [
  "pytest>=9.0.3",
  "pytest-httpx>=0.36.2",
]
dev = [
  { include-group = "site" },
  { include-group = "test" },
  "dprint-py==0.53.1.0",
  "ruff==0.15.15",
  "uvloop>=0.22.1,<1; sys_platform != 'win32'",
]

[tool.uv.sources]
typestats-site = { workspace = true, editable = true }

[tool.uv.workspace]
members = ["packages/*"]

# pytest

[tool.pytest]
minversion = "9.0"
testpaths = ["src", "tests"]
addopts = ["-ra", "--doctest-modules", "--ignore=tests/fixtures"]
doctest_optionflags = [
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "ELLIPSIS",
]
filterwarnings = ["error"]
log_level = "INFO"
strict = true

# pyrefly

[tool.pyrefly]
project-excludes = ["tests/fixtures/**"]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
implicit-abstract-class = "error"
implicit-any = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
missing-source = "ignore"
not-required-key-access = "error"
open-unpacking = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
untyped-import = "error"
unused-ignore = "error"
variance-mismatch = "error"

# (based)pyright

[tool.pyright]
extraPaths = ["packages/typestats-site/src"]
ignore = [".venv", "tests/fixtures/**"]
allowedUntypedLibraries = ["watchfiles"]
stubPath = "."
pythonPlatform = "All"
typeCheckingMode = "strict"
deprecateTypingAliases = true
enableReachabilityAnalysis = false
enableTypeIgnoreComments = false
reportImplicitOverride = true
reportImportCycles = true
reportUnnecessaryComparison = true
reportUnnecessaryTypeIgnoreComment = true
reportPrivateUsage = false

# ruff

[tool.ruff]
src = [
  "src",
  "tests",
  "packages/typestats-site/src",
  "packages/typestats-site/tests",
]
extend-exclude = [".cache", ".pytest_cache", "tests/fixtures"]
force-exclude = true
show-fixes = true
preview = true

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401", # flake8-annotations - any-type
  "COM812", # missing-trailing-comma - conflicts with formatter
  "S101", # flake8-bandit - assert
  "S404", # flake8-bandit - suspicious-subprocess-import
  "FBT", # flake8-boolean-trap
  "CPY", # flake8-copyright
  "FIX", # flake8-fixme
  "TD003", # flake8-todos - missing-todo-link
  "D", # pydocstyle
  "DOC201", # pydoclint - docstring-missing-returns
  "TRY003", # tryceratops - raise-vanilla-args
  "RUF067", # ruff - non-empty-init-module
]

[tool.ruff.lint.per-file-ignores]
"packages/typestats-site/tests/**" = [
  "PLC2701", # pylint - import-private-name
  "PLR6301", # pylint - no-self-use
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
