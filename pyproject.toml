[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[project]
name = "typestats"
version = "0.0.0.dev0"
description = "Type annotation coverage statistics for Python packages"
readme = "README.md"
authors = [
  { name = "Joren Hammudoglu", email = "jhammudoglu@gmail.com" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
  "mainpy>=1.5,<2", # like `if __name__ == "__main__": ...` but Pythonic
  "anyio>=4.12.1,<5", # like asyncio but with a decent API (asyncio is a mess)
  "uvloop>=0.22.1,<1; sys_platform != 'win32'",
  "libcst>=1.8.6,<2", # like ast but preservers comments/formatting and other goodies
  "pydantic>=2.12.5,<3",
  "ruff>=0.15.2,<1",
]

[project.optional-dependencies]
pypi = [
  "httpx[http2]>=0.28.1,<1", # like requests but modern and with async support
  "httpx-retries>=0.4.6",
  "packaging>=26.0",
]
docs = [
  "jinja2>=3.1.6,<4",
  "packaging>=26.0",
  "tabulate>=0.9.0,<1",
  "zensical>=0.0.24,<0.1",
]

[project.scripts]
typestats = "typestats:__main__.app"

[dependency-groups]
test = [
  "typestats[pypi,docs]",
  "pytest>=9.0.2",
  "pytest-httpx>=0.36.0,<1",
  "test-project",
]
dev = [
  { include-group = "test" },
  "dprint-py>=0.52.0.0",
  "pyrefly>=0.54.0",
]

[tool.uv.sources]
test-project = { workspace = true }

[tool.uv.workspace]
members = [
  "tests/fixtures/project",
]

# pytest

[tool.pytest]
minversion = "9.0"
testpaths = ["src", "tests"]
addopts = ["-ra", "--doctest-modules", "--ignore=tests/fixtures"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL", "ELLIPSIS"]
filterwarnings = ["error"]
log_level = "INFO"
strict = true

# pyrefly

[tool.pyrefly]
project-excludes = ["tests/fixtures/stubs_base"]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unused-ignore = "error"

# (based)pyright

[tool.pyright]
ignore = [".venv", "tests/fixtures/**"]
stubPath = "."
pythonPlatform = "All"
typeCheckingMode = "strict"
deprecateTypingAliases = true
enableReachabilityAnalysis = false
enableTypeIgnoreComments = false
reportImplicitOverride = true
reportImportCycles = true
reportUnnecessaryComparison = false
reportUnnecessaryTypeIgnoreComment = true
reportPrivateUsage = false

# ruff

[tool.ruff]
src = ["src", "tests"]
extend-exclude = [".git", ".mypy_cache", ".tox", ".venv"]
force-exclude = true
show-fixes = true
preview = true

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401", # flake8-annotations - any-type
  "S101", # flake8-bandit - assert
  "FBT", # flake8-boolean-trap
  "CPY", # flake8-copyright
  "FIX", # flake8-fixme
  "TD003", # flake8-todos - missing-todo-link
  "D", # pydocstyle
  "DOC201", # pydoclint - docstring-missing-returns
  "TRY003", # tryceratops - raise-vanilla-args
  "RUF067", # ruff - non-empty-init-module
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["ALL"]
